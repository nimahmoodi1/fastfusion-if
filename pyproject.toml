[project]
name = "fastfusion-if"
version = "1.0.0"
description = "Surface-atom cross-modal fusion for protein interface prediction"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "biopython>=1.81",
  "torch>=2.1",
  "tqdm>=4.66",
  "dill>=0.3.7",
]

[project.optional-dependencies]
# Only needed for the ESM-2 feature phase (Phase 2): pip install -e ".[plm]"
plm = ["fair-esm>=2.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["fastfusion_if*"]
