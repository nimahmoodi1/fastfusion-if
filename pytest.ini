[pytest]
testpaths = tests
addopts = -q
# Make `pytest` and `python -m pytest` behave identically. Without this the
# bare console script does not put the repo root on sys.path and every test
# module fails with ModuleNotFoundError: No module named 'fastfusion_if'.
# Requires pytest >= 7; tests/conftest.py does the same for older versions.
pythonpath = . scripts
# A machine with ROS 2 installed puts launch_testing_ros on the pytest plugin
# path; it registers a hook recent pytest does not know and crashes collection
# with PluginValidationError. Disable third-party autoload for this project.
filterwarnings =
    ignore::DeprecationWarning
